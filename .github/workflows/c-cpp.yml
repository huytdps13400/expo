// packages/database/prisma/schema.prisma

generator client {
  provider = "prisma-client-js"
}

datasource db {
  provider = "postgresql"
  url      = env("DATABASE_URL")
}

model User {
  id           String          @id @default(uuid())
  email        String          @unique
  name         String
  role         Role            @default(USER)
  deviceFinger String
  createdAt    DateTime        @default(now())
  accesses     UserAccess[]
  orders       PurchaseOrder[]
  decisions    Decision[]
}

model Product {
  id          String          @id @default(uuid())
  name        String
  slug        String          @unique
  price       Int
  tier        Int             // 1-4 階對應前端分段
  active      Boolean         @default(true)
  orders      PurchaseOrder[]
}

model PurchaseOrder {
  id             String      @id @default(uuid())
  orderNumber    String      @unique
  status         OrderState  @default(PENDING)
  totalAmount    Int
  paymentProvider String     // "PAYPAL", "TRUST"
  paymentStatus  String
  idempotencyKey String      @unique
  userId         String
  productId      String
  user           User        @relation(fields: [userId], references: [id])
  product        Product     @relation(fields: [productId], references: [id])
  createdAt      DateTime    @default(now())
}

model UserAccess {
  id          String      @id @default(uuid())
  userId      String
  productId   String
  accessLevel AccessLevel @default(FULL)
  createdAt   DateTime    @default(now())
  user        User        @relation(fields: [userId], references: [id])
  
  @@unique([userId, productId])
}

model Decision {
  id         String   @id @default(uuid())
  userId     String
  context    Json     // 姓名, 生日, 出生時辰, 出生地, 最近問題
  rawPreview Json     // 40% 免費褒貶參半攻勢
  fullReport Json?    // 鎖定的核心付費內容
  status     String   @default("PREVIEW") // PREVIEW, GENERATING, COMPLETED
  createdAt  DateTime @default(now())
  user       User     @relation(fields: [userId], references: [id])
}

model WebhookEvent {
  id          String   @id @default(uuid())
  provider    String
  eventId     String   @unique
  processed   Boolean  @default(false)
  createdAt   DateTime @default(now())
}

enum Role {
  SUPER_ADMIN
  ADMIN
  USER
}

enum AccessLevel {
  TRIAL
  FULL
  VIP
}

enum OrderState {
  PENDING
  PROCESSING
  PAID
  UNLOCKED
  COMPLETED
  FAILED
}


