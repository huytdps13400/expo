GUBON-EX LANGUAGE & DETERMINISTIC CONTRACT — FREEZE    
    
這版可以正式定下來。核心原則非常清楚：    
    
> 繁體中文負責表達；English Canonical ID 負責標準化；1～9 負責有限狀態運算；Template 負責組裝；AI 負責受限生成，不負責改變核心計算。    
    
    
    
