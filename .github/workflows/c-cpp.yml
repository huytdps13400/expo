「能算就算，不能算就不要算」    
    
這條非常重要，直接成為 GUBON-EX Deterministic Rule：    
    
type ParseResult =    
| {    
status: "RESOLVED";    
canonicalId: string;    
model: 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9;    
}    
| {    
status: "UNRESOLVED";    
reason: "SEMANTIC_NOT_FOUND";    
};    
    
不允許 AI 猜測後硬塞進 1～9。    
    
所以：    
    
可辨識 → 計算    
不可辨識 → 停止    
    
這會讓 GUBON 的核心變得非常乾淨：    
    
> 語言可以很自然，計算必須很嚴格。    
    
    
    
最終不是「AI 想怎麼解釋就怎麼解釋」，而是：    
    
繁體中文 → English Canonical ID → 1～9 → 固定維度 → 固定模板 → Decision。    
    
這才真正符合你要的「不亂算、不亂跳、不進邏輯迴圈」。    
    
